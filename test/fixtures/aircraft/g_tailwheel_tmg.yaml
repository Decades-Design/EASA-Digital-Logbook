# A touring motor glider with a tailwheel. TMG is its own EASA class rating
# with its own revalidation rules under FCL.740.A, and is not a glider.
#
# Carries the one qualification that maps roughly one-to-one between the two
# systems — tailwheel is an FAA endorsement (§61.31(i)) and an EASA
# differences item (TW). They are still separate values, because the app must
# not assume any other pair corresponds.

registration: "G-TMGA"
manufacturer: "Scheibe"
model: "SF-25C Falke"

category: "touring_motor_glider"
engine_type: "piston"
engine_count: 1
operating_surface: "land"

requires_multi_crew: false

required_qualifications:
  "us.faa.part61":
    - "faa_tailwheel"          # §61.31(i)
  "eu.easa.part-fcl":
    - "easa_tailwheel"         # TW
    - "easa_variable_pitch_propeller"
