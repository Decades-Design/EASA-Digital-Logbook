# A complex, high-performance, technically advanced single. The fixture that
# makes all three FAA derivations answer true at once, so a primitive that
# ignores one of its conditions cannot pass unnoticed.
#
# Derived FAA categories (computed, NOT stored):
#   §61.31(e)  complex              = true  (retractable + flaps + var pitch)
#   §61.31(f)  high-performance     = true  (300 hp > 200)
#   §61.129(j) technically advanced = true  (PFD + MFD moving map + autopilot)
#   EASA class rating               = SEP(land)
#
# GM1 FCL.700 differences training applies for retractable undercarriage,
# variable pitch and EFIS — a different list from the FAA's, over the same
# facts, which is the whole reason equipment is stored and categories are not.

registration: "N456BD"
manufacturer: "Beechcraft"
model: "A36 Bonanza"
icao_type_designator: "BE36"

category: "aeroplane"
engine_type: "piston"
engine_count: 1
operating_surface: "land"

requires_multi_crew: false

horsepower: 300
maximum_takeoff_mass_lb: 3650     # certificated in lb; see Mass
service_ceiling_feet: 18500

equipment:
  - "retractable_undercarriage"
  - "flaps"
  - "variable_pitch_propeller"
  - "electronic_flight_instrument_system"
  - "primary_flight_display"
  - "multi_function_display_with_moving_map"
  - "integrated_autopilot"
