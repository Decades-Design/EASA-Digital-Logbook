# A floatplane. §61.31(e) drops the retractable-gear condition for seaplanes —
# "in the case of a seaplane, flaps and a controllable pitch propeller" — so
# this is complex despite having no retractable undercarriage.
#
# Without this fixture a primitive that always demands retractable gear passes
# every other test in the set.
#
# Derived FAA categories (computed, NOT stored):
#   §61.31(e)  complex              = TRUE, on flaps + variable pitch alone
#   §61.31(f)  high-performance     = true  (260 hp)
#   §61.129(j) technically advanced = false
#   EASA class rating               = SEP(sea)

registration: "G-FLOT"
manufacturer: "de Havilland Canada"
model: "DHC-2 Beaver"
icao_type_designator: "DHC2"

category: "aeroplane"
engine_type: "piston"
engine_count: 1
operating_surface: "sea"

requires_type_rating: false
requires_multi_crew: false

horsepower: 450

equipment:
  - "flaps"
  - "variable_pitch_propeller"
