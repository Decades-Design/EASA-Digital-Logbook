# The canonical instrument-time divergence case: an IFR flight plan filed,
# flown entirely in clear air. No actual or simulated instrument time is
# recorded because none was flown.
#
# Expected projections (asserted in the M1 divergence suite, issue #30 —
# NOT stored here):
#   EASA AMC1 FCL.050 column 9: full block time as IFR — an operational
#                                condition, independent of the weather.
#   FAA  §61.51(g)(1):           zero actual instrument time. The FAA has
#                                no "flew under an IFR flight plan" column.
#
# Raw facts only. See CLAUDE.md rule 1 and ADR-0001.

