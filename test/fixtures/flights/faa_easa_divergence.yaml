# The canonical FAA/EASA divergence case.
# Rated private pilot, sole manipulator, instructor aboard giving instruction.
#
# Expected projections (asserted in M1, issues #18 and #19 — NOT stored here):
#   FAA  §61.51(e)(1)(i): PIC = full flight time, dual = full flight time
#   EASA FCL.010:         PIC = 0,                dual = full flight time
#
# Raw facts only. See CLAUDE.md rule 1 and ADR-0001.

# Descriptive only — not decoded onto Flight, which has no synthetic id
# (persistence identity is M2's concern). Kept for human readability.
id: "faa-easa-divergence-001"

# All instants UTC. See ADR-0002.
off_blocks: "2026-03-14T09:05:00Z"
takeoff: "2026-03-14T09:18:00Z"
landing: "2026-03-14T10:42:00Z"
on_blocks: "2026-03-14T10:51:00Z"

aircraft_registration: "G-ABCD"

# Quoted deliberately — see the YAML caveat in test/fixtures/README.md.
route:
  - "EGKA"
  - "EGHR"
  - "EGKA"

# The discriminators the divergence turns on — PilotCapacity (#13), embedded
# as one block rather than flattened back onto Flight.
capacity:
  command_authority: false      # EASA PIC requires this; the instructor held it
  sole_manipulator: true        # FAA §61.51(e)(1)(i) PIC turns on this
  sole_occupant: false
  multi_pilot_operation: false
  additional_crew_required_by_rule: false
  acting_as_instructor: false   # this pilot is the student, not the instructor
  acting_as_examiner: false
  picus_claimed: false
  pic_intervention_not_required: false
  instructor:
    capacity: "FI"                # FI | FE
    influenced_flight: true       # so this is dual, not SPIC

carrying_passengers: false

# Take-offs and landings are stored as two independent sets of four counts,
# never one combined figure and never one derived from the other. A pilot who
# takes over in flight has zero take-offs and one landing; a pilot who hands
# over has the reverse. FAA §61.57(a) and §61.57(b) both count take-offs;
# EASA AMC1 FCL.050 column 8 counts landings. See docs/jurisdiction-matrix.md
# §9 and docs/entry-form.md §5 — omitting take-offs cannot be backfilled.
#
# The split mirrors the landings so the two stay pairable: a take-off is
# either from a standing start (`full_stop`) or the rolling departure out of a
# touch-and-go. Four circuits at EGHR by day, all flown by this pilot: the
# standing departure from EGKA, three rolling take-offs out of the three
# touch-and-goes, and the full-stop landing back at EGKA. No night flying.
takeoffs:
  day_full_stop: 1
  day_touch_and_go: 3
  night_full_stop: 0
  night_touch_and_go: 0

landings:
  day_full_stop: 1
  day_touch_and_go: 3
  night_full_stop: 0
  night_touch_and_go: 0

ifr_flight_plan_filed: false
actual_instrument_minutes: 0
simulated_instrument_minutes: 0
holding_procedures_count: 0
tracking_performed: false

remarks: "Dual instruction, circuits at EGHR. Student rated PPL(A) SEP."
