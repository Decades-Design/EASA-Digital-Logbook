name: easa_digital_log
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  csv: ^8.0.0
  # drift is pinned to exactly 2.34.0, not ^2.34.3. drift_dev 2.34.0's
  # schema-dump command (`dart run drift_dev schema dump`) throws
  # "The getter 'allSchemaEntities' isn't defined for the type
  # 'GeneratedDatabase'" against drift 2.34.3's drift3_preview module — an
  # incompatibility between that drift patch and drift_dev 2.34.0's
  # verifier code. drift_dev can't be upgraded past 2.34.0 either: 2.34.1+
  # needs analyzer ^13, which conflicts with the freezed 3.2.5 pin below
  # (analyzer <11). Pinning drift down to exactly 2.34.0 — the version
  # drift_dev 2.34.0 actually resolved against — fixes the schema dump
  # command; verified all 355 existing tests still pass at this version.
  drift: 2.34.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  sqlite3_flutter_libs: ^0.6.0+eol
  yaml: ^3.1.3

dev_dependencies:
  # freezed is pinned to ^3.2.5 deliberately, NOT ^3.0.0.
  # freezed 3.0.0-3.2.4 depend on build ^3 / source_gen ^3 / analyzer ^8.
  # build_runner >=2.15.1 needs build ^4, and json_serializable >=6.13.1
  # needs source_gen ^4.1.2 / analyzer >=10. A ^3.0.0 constraint resolves
  # to 3.0.0 and then fails to co-resolve with either of them.
  # 3.2.5 is the first stable freezed on the build 4 / analyzer 10 stack.
  freezed: ^3.2.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  # Only used by test/domain/currency/currency_rule_schema_test.dart and
  # tool/check_currency_rules.dart -- the app never validates against the
  # published JSON Schema at runtime, see currency_rule_yaml.dart's dartdoc.
  json_schema: ^5.2.2
  json_serializable: ^6.14.1
  # drift_dev is capped below 2.34.1 by the freezed pin above, not by choice
  # — see the comment on the drift dependency for the full chain.
  drift_dev: ^2.34.0
  path: ^1.9.1
  sqlite3: ^3.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/aerodromes/
    - assets/jurisdictions/
    - assets/rules/
